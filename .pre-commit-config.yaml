repos:
  - repo: local
    hooks:
      - id: gitleaks
        name: Gitleaks - working tree
        entry: gitleaks dir . --redact --no-banner
        language: system
        pass_filenames: false
      - id: hadolint
        name: Hadolint - Dockerfile
        entry: hadolint Dockerfile
        language: system
        pass_filenames: false
        files: ^Dockerfile$
