apiVersion: v1
kind: Pod
metadata:
  name: bad-no-limits
  namespace: secure-app
spec:
  containers:
    - name: app
      image: nginx:1.27
---
apiVersion: v1
kind: Pod
metadata:
  name: good-limits
  namespace: secure-app
spec:
  containers:
    - name: app
      image: nginx:1.27
      resources:
        limits: {cpu: 250m, memory: 128Mi}
