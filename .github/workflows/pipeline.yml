name: secure-pipeline
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Semgrep SAST
        run: |
          python -m pip install semgrep
          semgrep scan --config p/python --error app/
      - name: Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
      - name: Checkov Terraform
        run: |
          python -m pip install checkov
          checkov -d terraform --framework terraform --quiet
      - name: Kyverno unit tests
        uses: kyverno/action-install-cli@v0.2.0
        with:
          release: v1.19.2
      - name: Kyverno policy tests
        run: kyverno test policies/tests/
  image:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v4
      - name: Build once, for both scan and publish
        run: docker build -t app:ci .
      - name: Trivy evidence JSON
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: app:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'
          format: json
          output: trivy-results.json
      - name: Trivy vulnerability gate
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: app:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
      - name: Upload Trivy evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: secure-release-trivy
          path: trivy-results.json
          if-no-files-found: ignore
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/app" >> "$GITHUB_ENV"
      - name: Authenticate to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the scanned image (no rebuild)
        id: push
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          docker tag app:ci "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:$GITHUB_SHA"
          REF=$(docker image inspect "$IMAGE:$GITHUB_SHA" --format '{{index .RepoDigests 0}}')
          test -n "$REF"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "name=${REF%@*}" >> "$GITHUB_OUTPUT"
          echo "digest=${REF##*@}" >> "$GITHUB_OUTPUT"
          echo "Signed subject: $REF" >> "$GITHUB_STEP_SUMMARY"
      - name: SBOM of the published image
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: anchore/sbom-action@v0.24.3
        with:
          image: ${{ steps.push.outputs.ref }}
          format: cyclonedx-json
          output-file: sbom.cdx.json
      - uses: sigstore/cosign-installer@v3
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      - name: Sign image with workflow identity
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: cosign sign --yes '${{ steps.push.outputs.ref }}'
      - name: Provenance attestation
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/attest@v4
        with:
          subject-name: ${{ steps.push.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - name: SBOM attestation
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/attest@v4
        with:
          subject-name: ${{ steps.push.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: sbom.cdx.json
          push-to-registry: true
          create-storage-record: false
